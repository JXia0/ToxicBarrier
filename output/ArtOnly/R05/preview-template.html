<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToxicBarrier 四级塔 R05</title>
<style>*{box-sizing:border-box}body{margin:0;background:#202521;color:#ece4cf;font:15px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:26px;margin:0}p{color:#bcbbae}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#303730;border:1px solid #58604d;border-radius:8px;padding:16px}.stage{height:350px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #7f8269}.sprite{position:relative;overflow:hidden;flex-shrink:0}.sprite img{position:absolute;max-width:none;image-rendering:pixelated}.label{margin-top:16px;color:#e5d5ac;font-size:19px}.note{font-size:12px;color:#aaa}.scene{height:720px;position:relative;background:#101712;margin-top:18px;overflow:hidden;border-radius:8px}.map{position:absolute;width:710px;height:710px;left:50%;top:5px;transform:translateX(-50%)}.placed{position:absolute;left:50%;bottom:285px;transform:translateX(-50%)}button{background:#465041;border:1px solid #8b927d;color:#eee8d9;padding:8px 14px;margin:6px 6px 0 0;cursor:pointer}.stamp{position:absolute;left:15px;top:12px;padding:6px 12px;background:#18221de8}.caption{position:absolute;bottom:10px;left:15px;background:#18221de8;font-size:12px;padding:6px}@media(max-width:900px){.row{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){main{padding:14px}.row{grid-template-columns:1fr}.scene{height:510px}.map{width:500px;height:500px}.placed{bottom:195px}}
</style><main><h1>ToxicBarrier · 0—3 级守望塔</h1><p>R05 · 3级已按最新反馈加高中段。下面按实际导入后的相对尺寸展示，基底统一。</p><div class="row" id="row"></div>
<h2>背景材质对照</h2><p>独立美术叠放示意，用于比较颜色与轮廓；不是Unity实机截图。画布缩放不代表摄像机参数。</p><div><button onclick="setMap(1)">旧金庭院</button><button onclick="setMap(2)">青绿遗迹</button><button onclick="setMap(3)">暗金遗迹</button></div><div><button onclick="setTower(0)">0级</button><button onclick="setTower(1)">1级</button><button onclick="setTower(2)">2级</button><button onclick="setTower(3)">3级 · 加高版</button></div><div class="scene"><img class="map" id="map"><div id="current"></div><div class="stamp" id="stamp"></div><div class="caption">原图保留生成器Alpha。此页仅作显示裁切与等比缩放。</div></div><p class="note">独立PNG：tower0.png、tower1.png、tower2.png、tower3.png。tower3-before-height-revision.png为旧版归档，不用于项目。</p></main>
<script>
const DATA=__DATA__, STATS=__STATS__, HEIGHTS=[2.2,2.5,2.9,3.4], CAPTIONS=['基础塔：单箭窗、短扶壁','加强护墙、双箭窗','加高塔身、上1下2箭窗','侧防御台、加高中央主塔'];
function sprite(i,worldScale){let a=STATS[i],b=a.visibleBounds,scale=HEIGHTS[i]*worldScale/(b[3]-b[1]),el=document.createElement('div');el.className='sprite';el.style.width=(b[2]-b[0])*scale+'px';el.style.height=(b[3]-b[1])*scale+'px';let im=new Image();im.src=DATA['tower'+i];im.style.width=a.width*scale+'px';im.style.height=a.height*scale+'px';im.style.left=-b[0]*scale+'px';im.style.top=-b[1]*scale+'px';el.append(im);return el}
for(let i=0;i<4;i++){let card=document.createElement('div');card.className='card';let stage=document.createElement('div');stage.className='stage';stage.append(sprite(i,82));card.append(stage);let label=document.createElement('div');label.className='label';label.textContent=i+' 级';card.append(label);let text=document.createElement('div');text.textContent=CAPTIONS[i];card.append(text);document.getElementById('row').append(card)}
function setMap(i){document.getElementById('map').src=DATA['map'+i]}
function setTower(i){let dest=document.getElementById('current');dest.replaceChildren();let el=sprite(i,58);el.classList.add('placed');dest.append(el);document.getElementById('stamp').textContent=i+' 级 · '+CAPTIONS[i]}
setMap(1);setTower(3);
</script></html>
